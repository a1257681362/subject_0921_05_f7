server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: evops-base
  profiles:
    active: dev
  aop:
    proxy-target-class: true
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: jdbc:h2:file:./data/evops;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.evops
  configuration:
    map-underscore-to-camel-case: true

evops:
  quota:
    # 预占占用有效期（分钟）：超时由定时任务自动归还；实扣必须在有效期内完成
    hold-minutes: 40
    # 过期预占扫描（默认每分钟第 17 秒，避开整分）；启动时另补扫一次停机期间过期的预占
    expire-scan-cron: "17 * * * * ?"
  sensitive:
    # 敏感词库路径。classpath: 随包默认；生产改 file:/path/sensitive-words.txt，
    # 文件变更自动热更新（扫描前懒检查 mtime），或 POST /api/sensitive/words/reload 立即重载
    dict-path: classpath:sensitive-words.txt
  batch:
    # 批量后台任务记录保留天数：终态任务 expire_time = 完成时间 + 该天数，到期定时物理清理
    retain-days: 21
    # 到期清理执行时刻（每日）；默认凌晨 03:17，避开整点
    cleanup-cron: "0 17 3 * * ?"
  report:
    # 加工单周汇总报告 Word 模板（poi-tl）。classpath: 随包默认；
    # 生产改 file:/path/weekly-orders.docx 外部化：改模板（抬头变量/明细列）即时生效，不用改代码
    weekly-template-path: classpath:templates/weekly-orders.docx
    # 明细表隔行底色（数据行第偶数条）；可关、可换色
    zebra-stripe: true
    zebra-color: F2F2F2
    # 明细表在文档中的序号（从 0 开始；默认模板仅一张表）
    detail-table-index: 0
    # 单次导出统计周期上限（天），防误拉全量
    max-period-days: 93
  openapi:
    # 对外开放加工单查询（/open/api/**，HMAC-SHA256 签名鉴权，免 Shiro Basic）
    # 接入方 appId -> secret；生产必须用环境变量/外部配置覆盖，不要把真实密钥提交进来。
    # 为空（未配置任何 app）时所有对外请求一律 SIGN_INVALID 拒绝。
    apps:
      demo-partner: ${OPENAPI_DEMO_SECRET:dev-only-please-override}
    # 请求时间戳允许的时钟偏移（分钟）：超出 [now-w, now+w] 一律 SIGN_EXPIRED
    timestamp-window-minutes: 15
    # nonce 去重保留窗口（分钟）：必须大于时间窗，到期行由定时任务每分钟物理清理
    nonce-retain-minutes: 30
    # 过期 nonce 清理时刻（每分钟第 43 秒，避开整点）；启动时另补扫一次停机期间到期行
    cleanup-cron: "43 * * * * ?"

logging:
  level:
    com.evops: INFO
